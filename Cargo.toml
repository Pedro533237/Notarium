[package]
name = "notarium"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
  ".",
  "crates/notarium-core",
  "crates/notarium-render",
  "crates/notarium-playback",
  "crates/notarium-io",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
egui = "0.33"

[dependencies]
eframe = { version = "0.33", default-features = true }
egui = { workspace = true }
notarium-core = { path = "crates/notarium-core" }
notarium-render = { path = "crates/notarium-render" }
notarium-playback = { path = "crates/notarium-playback" }
notarium-io = { path = "crates/notarium-io" }

[dev-dependencies]
pretty_assertions = "1"
